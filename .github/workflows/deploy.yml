name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build JAR
        run: ./gradlew build -x test

      - name: Rename JAR
        run: |
          mkdir -p artifact
          cp build/libs/*-SNAPSHOT.jar artifact/app.jar

      - name: Upload JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "artifact/app.jar"
          target: "/tmp"
          strip_components: 1

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          CLOVA_OCR_INVOKE_URL: ${{ secrets.CLOVA_OCR_INVOKE_URL }}
          CLOVA_OCR_SECRET_KEY: ${{ secrets.CLOVA_OCR_SECRET_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DB_PASSWORD,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,KAKAO_CLIENT_ID,KAKAO_CLIENT_SECRET,NAVER_CLIENT_ID,NAVER_CLIENT_SECRET,CLOVA_OCR_INVOKE_URL,CLOVA_OCR_SECRET_KEY
          script: |
            set -e
            # /etc/gudocs/env 를 배포마다 시크릿에서 렌더링 (GitHub Secrets가 소스)
            sudo install -d -m 755 /etc/gudocs
            sudo tee /etc/gudocs/env > /dev/null <<EOF
            DB_URL=jdbc:mysql://127.0.0.1:3306/gudocs
            DB_USER=gudocs
            DB_PASSWORD=${DB_PASSWORD}
            CORS_ALLOWED_ORIGINS=https://gudocs-fe-v2.vercel.app,http://localhost:5173,http://localhost:5174
            COOKIE_SAME_SITE=lax
            COOKIE_SECURE=true
            GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
            GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
            KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID}
            KAKAO_CLIENT_SECRET=${KAKAO_CLIENT_SECRET}
            NAVER_CLIENT_ID=${NAVER_CLIENT_ID}
            NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET}
            OAUTH_SUCCESS_REDIRECT=https://gudocs-fe-v2.vercel.app
            OAUTH_REDIRECT_BASE=https://gudocs-fe-v2.vercel.app
            CLOVA_OCR_INVOKE_URL=${CLOVA_OCR_INVOKE_URL}
            CLOVA_OCR_SECRET_KEY=${CLOVA_OCR_SECRET_KEY}
            EOF
            sudo chmod 600 /etc/gudocs/env
            sudo mv /tmp/app.jar /opt/gudocs/app.jar
            sudo chown ubuntu:ubuntu /opt/gudocs/app.jar
            sudo systemctl restart gudocs
            sleep 5
            sudo systemctl is-active gudocs
