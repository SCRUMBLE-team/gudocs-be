name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build JAR
        run: ./gradlew build -x test

      - name: Rename JAR
        run: |
          mkdir -p artifact
          cp build/libs/*-SNAPSHOT.jar artifact/app.jar

      - name: Upload JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "artifact/app.jar"
          target: "/tmp"
          strip_components: 1

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          CLOVA_OCR_INVOKE_URL: ${{ secrets.CLOVA_OCR_INVOKE_URL }}
          CLOVA_OCR_SECRET_KEY: ${{ secrets.CLOVA_OCR_SECRET_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_BASE64 }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DB_PASSWORD,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,KAKAO_CLIENT_ID,KAKAO_CLIENT_SECRET,NAVER_CLIENT_ID,NAVER_CLIENT_SECRET,CLOVA_OCR_INVOKE_URL,CLOVA_OCR_SECRET_KEY,FIREBASE_SERVICE_ACCOUNT_JSON_BASE64
          script: |
            set -e
            sudo install -d -m 755 /etc/gudocs

            # FCM: 서비스 계정 JSON(base64) 시크릿이 있을 때만 디코드해 파일로 렌더링하고 FCM을 켠다.
            # (파일 없이 FIREBASE_ENABLED=true면 크레덴셜 로드 실패로 앱이 기동하지 않음)
            # JSON은 멀티라인/특수문자가 많아 raw 대신 base64로 전달한다.
            FIREBASE_ENABLED=false
            if [ -n "${FIREBASE_SERVICE_ACCOUNT_JSON_BASE64}" ]; then
              printf '%s' "${FIREBASE_SERVICE_ACCOUNT_JSON_BASE64}" | base64 -d | sudo tee /etc/gudocs/firebase-service-account.json > /dev/null
              # 서비스는 ubuntu 사용자로 실행되므로 크레덴셜 파일 소유자도 ubuntu여야 읽을 수 있다.
              sudo chown ubuntu:ubuntu /etc/gudocs/firebase-service-account.json
              sudo chmod 600 /etc/gudocs/firebase-service-account.json
              FIREBASE_ENABLED=true
            fi

            # /etc/gudocs/env 를 배포마다 시크릿에서 렌더링 (GitHub Secrets가 소스)
            sudo tee /etc/gudocs/env > /dev/null <<EOF
            DB_URL=jdbc:mysql://127.0.0.1:3306/gudocs
            DB_USER=gudocs
            DB_PASSWORD=${DB_PASSWORD}
            CORS_ALLOWED_ORIGINS=https://gudocs-fe-v2.vercel.app,http://localhost:5173,http://localhost:5174
            COOKIE_SAME_SITE=lax
            COOKIE_SECURE=true
            GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
            GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
            KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID}
            KAKAO_CLIENT_SECRET=${KAKAO_CLIENT_SECRET}
            NAVER_CLIENT_ID=${NAVER_CLIENT_ID}
            NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET}
            OAUTH_SUCCESS_REDIRECT=https://gudocs-fe-v2.vercel.app
            OAUTH_REDIRECT_BASE=https://gudocs-fe-v2.vercel.app
            CLOVA_OCR_INVOKE_URL=${CLOVA_OCR_INVOKE_URL}
            CLOVA_OCR_SECRET_KEY=${CLOVA_OCR_SECRET_KEY}
            FIREBASE_ENABLED=${FIREBASE_ENABLED}
            GOOGLE_APPLICATION_CREDENTIALS=/etc/gudocs/firebase-service-account.json
            FRONTEND_BASE_URL=https://gudocs-fe-v2.vercel.app
            FCM_NOTIFICATION_CRON=0 0 9 * * *
            EOF
            sudo chmod 600 /etc/gudocs/env
            sudo mv /tmp/app.jar /opt/gudocs/app.jar
            sudo chown ubuntu:ubuntu /opt/gudocs/app.jar
            sudo systemctl restart gudocs
            sleep 5
            sudo systemctl is-active gudocs
