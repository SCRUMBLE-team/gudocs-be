spring:
  datasource:
    url: jdbc:h2:mem:gudocs-local;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: true
  # local 은 H2 create-drop 로 스키마 생성 → Flyway(MySQL 방언) 비활성
  flyway:
    enabled: false
  session:
    jdbc:
      initialize-schema: embedded   # H2 에 SPRING_SESSION 테이블 자동 생성

app:
  oauth:
    success-redirect: ${OAUTH_SUCCESS_REDIRECT:http://localhost:5173}