spring:
  application:
    name: gudocs
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/gudocs}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jpa:
    hibernate:
      # Flyway 가 스키마 단일 소스. 앱은 검증만(불일치 시 기동 실패로 조기 감지)
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        use_sql_comments: true
    show-sql: false
  flyway:
    enabled: true
    # 기존 운영 DB(ddl-auto=update 로 생성됨)는 V1 을 "이미 적용됨"으로 봉인하고 V2 부터 적용.
    # 빈 DB 는 V1 부터 전부 실행.
    baseline-on-migrate: true
    baseline-version: 1
  session:
    # 저장소 선택은 classpath(spring-session-jdbc)에 맡긴다.
    # (spring.session.store-type 은 Boot 3.4+ 에서 제거된 프로퍼티)
    timeout: ${SESSION_TIMEOUT:30d}   # idle timeout (기본 30분 → 30일)
    jdbc:
      initialize-schema: never        # 세션 테이블은 Flyway(V3)로 생성
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy}
            redirect-uri: "${OAUTH_REDIRECT_BASE:{baseUrl}}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - email
              - profile
          kakao:
            client-id: ${KAKAO_CLIENT_ID:dummy}
            client-secret: ${KAKAO_CLIENT_SECRET:dummy}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "${OAUTH_REDIRECT_BASE:{baseUrl}}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - account_email
            client-name: Kakao
          naver:
            client-id: ${NAVER_CLIENT_ID:dummy}
            client-secret: ${NAVER_CLIENT_SECRET:dummy}
            authorization-grant-type: authorization_code
            redirect-uri: "${OAUTH_REDIRECT_BASE:{baseUrl}}/login/oauth2/code/{registrationId}"
            scope:
              - name
              - email
            client-name: Naver
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

server:
  port: 8080
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        same-site: ${COOKIE_SAME_SITE:lax}
        secure: ${COOKIE_SECURE:false}
        max-age: ${SESSION_COOKIE_MAX_AGE:30d}   # persistent cookie (브라우저 종료 후에도 유지)

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
  oauth:
    # 필수 환경변수 — 미설정 시 애플리케이션 기동 실패 (local/test 프로파일은 자체 기본값 보유)
    success-redirect: ${OAUTH_SUCCESS_REDIRECT}
  ocr:
    clova:
      invoke-url: ${CLOVA_OCR_INVOKE_URL:}
      secret-key: ${CLOVA_OCR_SECRET_KEY:}
  firebase:
    # true일 때만 Firebase Admin 초기화 + FcmPushSender + 스케줄러 활성화
    enabled: ${FIREBASE_ENABLED:false}
    # 알림 클릭 시 이동할 프론트 기준 URL
    frontend-base-url: ${FRONTEND_BASE_URL:https://gudocs-fe-v2.vercel.app}
    # 결제 예정 알림 스케줄러 cron (Asia/Seoul). 기본: 매일 09:00
    notification-cron: ${FCM_NOTIFICATION_CRON:0 0 9 * * *}
    # 구독 검사 유도 알림 스케줄러 cron (Asia/Seoul). 기본: 매일 09:10
    review-cron: ${FCM_REVIEW_CRON:0 10 9 * * *}
